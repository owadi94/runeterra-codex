<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Lab</title>
<!-- Local review page (not part of the site): look at one city piece on its own, from any angle, before it goes into the city.
     Open http://localhost:5173/tools/lab.html -->
<style>
  :root { --bg: #11151c; --panel: #1b212b; --line: #2e3744; --text: #e7e3d8; --muted: #9aa3ad; --gold: #d8b25c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  .bar { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
         background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); padding: 8px; border-radius: 8px; }
  .bar b { color: var(--gold); margin-right: 6px; }
  .bar span { color: var(--muted); margin: 0 4px 0 10px; }
  button, select { background: #252d39; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: var(--gold); }
  button.on { border-color: var(--gold); color: var(--gold); }
  .hint { position: fixed; left: 12px; bottom: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; border-radius: 6px; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="view"></div>
<div class="bar">
  <b>Model Lab</b>
  <select id="piece">
    <option value="gate">The Last Gate (whole)</option>
    <option value="guardian">Gate guardian</option>
    <option value="stones">Stone textures</option>
  </select>
  <span>View</span>
  <button data-cam="front">Front</button><button data-cam="side">Side</button><button data-cam="top">Top</button>
  <button data-cam="inside">Inside</button><button data-cam="eye">Eye level</button>
  <span>Light</span>
  <button data-light="day" class="on">Day</button><button data-light="sunset">Sunset</button>
  <span>Show</span>
  <button id="wire">Wireframe</button><button id="grid" class="on">Grid</button><button id="spin">Turntable</button>
  <button id="shot">Save screenshot</button>
</div>
<div class="hint">Drag to orbit · right-drag to pan · scroll to zoom · grid squares are 5 m · the white figure is 1.8 m</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { placeLastGate, poseGuardian } from '../js/explore/last-gate.js';
import { stoneMaterial, grassMaterial } from '../js/explore/stone.js';

const host = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;

let scene, sun, hemi, grid, piece = 'gate', lightMode = 'day';
const WALL_R = 92;                                   // the gate sits at the city wall's radius, as in the city
const views = {
  gate: { target: [0, 12, WALL_R - 20], front: [0, 22, WALL_R + 75], side: [95, 25, WALL_R - 15], top: [0, 150, WALL_R - 19], inside: [0, 14, WALL_R - 70], eye: [0, 1.7, WALL_R + 40] },
  guardian: { target: [0, 1, 0], front: [0, 1.3, 4.5], side: [4.5, 1.3, 0], top: [0, 6, 0.01], inside: [-3, 1.6, 3], eye: [0.6, 1.7, 2.2] },
  stones: { target: [0, 2, 0], front: [0, 2.5, 11], side: [11, 2.5, 0], top: [0, 14, 0.01], inside: [-6, 3, 6], eye: [0, 1.7, 6] },
};

function setLight(mode) {
  lightMode = mode;
  const day = mode === 'day';
  scene.background = new THREE.Color(day ? 0xa9c2dc : 0xe0a782);
  sun.color.set(day ? 0xfff2dc : 0xffb070); sun.intensity = day ? 2.6 : 2.1;
  sun.position.set(day ? -60 : -120, day ? 120 : 35, day ? 80 : 40);
  hemi.color.set(day ? 0xdfe8ff : 0xffc9a8); hemi.groundColor.set(day ? 0x8a8070 : 0x5a4a60);
  renderer.toneMappingExposure = day ? 1 : 0.9;
  document.querySelectorAll('[data-light]').forEach(b => b.classList.toggle('on', b.dataset.light === mode));
}

function build() {
  scene = new THREE.Scene();
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.userData.env = 0.6;
  hemi = new THREE.HemisphereLight(0xdfe8ff, 0x8a8070, 0.9); scene.add(hemi);
  sun = new THREE.DirectionalLight(0xfff2dc, 2.6); sun.castShadow = true;
  // the shadow box fits the piece, so a 2 m figure is not shadowed in 6 cm blotches meant for the whole gate
  const sh = piece === 'gate' ? 120 : 8;
  sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -sh, right: sh, top: sh, bottom: -sh, near: 1, far: 500 });
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = piece === 'gate' ? 0.05 : 0.01;
  sun.target.position.set(0, 0, piece === 'gate' ? WALL_R - 20 : 0); scene.add(sun, sun.target);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), grassMaterial(THREE, { env: 0.6 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const c = piece === 'gate' ? WALL_R - 20 : 0, size = piece === 'gate' ? 300 : 30;
  grid = new THREE.GridHelper(size, size / 5, 0x6a6458, 0x9a9384); grid.position.set(0, 0.03, c); scene.add(grid);
  grid.visible = document.getElementById('grid').classList.contains('on');
  // a 1.8 m person for scale
  const person = new THREE.Mesh(new THREE.CapsuleGeometry(0.25, 1.3, 4, 12), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  person.position.set(piece === 'gate' ? 4 : 1.2, 0.9, piece === 'gate' ? WALL_R + 30 : 1.2); person.castShadow = true; scene.add(person);

  if (piece === 'gate') placeLastGate(THREE, scene, { wallR: WALL_R, circle() {}, box() {} });
  if (piece === 'guardian') {
    new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('../models/demacian-knight.glb', gltf => {
      const mat = stoneMaterial(THREE, 'marble', { env: 0.6, tile: 3 }), holder = new THREE.Group(), k = SkeletonUtils.clone(gltf.scene);
      holder.add(k); k.traverse(o => { if (o.isMesh) { o.material = mat; o.castShadow = o.receiveShadow = true; o.frustumCulled = false; } });
      holder.add(poseGuardian(THREE, k, gltf.animations[0], mat)); scene.add(holder);
    });
  }
  if (piece === 'stones') {
    ['marble', 'blocks', 'smooth', 'polished'].forEach((kind, i) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 3), stoneMaterial(THREE, kind, { env: 0.6 }));
      m.position.set(-6 + i * 4, 2, 0); m.castShadow = m.receiveShadow = true; scene.add(m);
    });
  }
  setLight(lightMode); setView('front');
}

function setView(name) {
  const v = views[piece];
  camera.position.set(...v[name]); controls.target.set(...v.target); controls.update();
}

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

document.getElementById('piece').onchange = e => { piece = e.target.value; build(); };
document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => setView(b.dataset.cam));
document.querySelectorAll('[data-light]').forEach(b => b.onclick = () => setLight(b.dataset.light));
const toggle = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { b.classList.toggle('on'); fn(b.classList.contains('on')); }; };
toggle('wire', on => scene.traverse(o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.wireframe = on; }); }));
toggle('grid', on => { grid.visible = on; });
toggle('spin', on => { controls.autoRotate = on; controls.autoRotateSpeed = 1.2; });
document.getElementById('shot').onclick = () => {
  renderer.render(scene, camera);
  const a = document.createElement('a'); a.download = `lab-${piece}-${Date.now()}.png`; a.href = renderer.domElement.toDataURL('image/png'); a.click();
};

// Links can open a piece and view directly: lab.html?piece=gate&cam=inside&light=sunset (also used for headless screenshots)
const qs = new URLSearchParams(location.search);
if (views[qs.get('piece')]) { piece = qs.get('piece'); document.getElementById('piece').value = piece; }
if (qs.get('light')) lightMode = qs.get('light');
build();
if (views[piece][qs.get('cam')]) setView(qs.get('cam'));
if (qs.get('pos')) { camera.position.set(...qs.get('pos').split(',').map(Number)); if (qs.get('at')) controls.target.set(...qs.get('at').split(',').map(Number)); controls.update(); }
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
document.title = 'Model Lab';
</script>
</body>
</html>
